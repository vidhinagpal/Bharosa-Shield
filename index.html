<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <title>Bharosa Shield (भरोसा शील्ड) — Instant Fraud & Document Verification</title>
  <link rel="manifest" href="manifest.json">
  <style>
:root {
  --primary: #1e3a8a; 
  --primary-light: #3b82f6;
  --primary-dark: #0f172a;
  --accent-saffron: #f97316;
  --accent-emerald: #10b981;
  --bg-slate: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-muted: #475569;
  --border: #e2e8f0;
  --scam-red: #dc2626;
  --scam-bg: #fef2f2;
  --scam-border: #f87171;
  
  --risky-amber: #d97706;
  --risky-bg: #fffbeb;
  --risky-border: #fcd34d;
  
  --verify-green: #059669;
  --verify-bg: #ecfdf5;
  --verify-border: #6ee7b7;

  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
}
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', 'Noto Sans Tamil', 'Noto Sans Telugu', sans-serif;
  background-color: var(--bg-slate);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
}
.app-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 16px 80px 16px;
}

.emergency-strip {
  background: linear-gradient(90deg, #991b1b, #dc2626);
  color: #ffffff;
  padding: 8px 16px;
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  margin-bottom: 16px;
}

.emergency-strip a {
  color: #fef08a;
  text-decoration: underline;
  margin-left: 6px;
}

.emergency-strip .call-badge {
  background: #ffffff;
  color: #dc2626;
  padding: 3px 10px;
  border-radius: 9999px;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.emergency-subtext {
  font-size: 0.8rem;
  display: none;
}

@media (min-width: 600px) {
  .emergency-subtext {
    display: block;
  }
}

.app-header {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-logo {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, #1e3a8a, #0284c7);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 26px;
  box-shadow: 0 4px 10px rgba(30, 58, 138, 0.25);
}

.brand-titles h1 {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-titles .tagline {
  font-size: 0.88rem;
  color: var(--text-muted);
}

.core-question-pill {
  background: #eff6ff;
  border: 1.5px solid #bfdbfe;
  color: #1e40af;
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.lang-select-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #f1f5f9;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  font-weight: 600;
  color: #334155;
  border: 1px solid #cbd5e1;
}

.lang-select-box select {
  background: transparent;
  border: none;
  font-weight: 700;
  color: #0f172a;
  outline: none;
  cursor: pointer;
  font-size: 0.88rem;
}

.main-nav {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

@media (max-width: 768px) {
  .main-nav {
    grid-template-columns: repeat(2, 1fr);
  }
}

.nav-tab-btn {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  padding: 14px 12px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--text-muted);
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
}

.nav-tab-btn .tab-icon {
  font-size: 1.35rem;
}

.nav-tab-btn .tab-sub {
  font-size: 0.75rem;
  font-weight: 500;
  color: #64748b;
}

.nav-tab-btn:hover {
  border-color: var(--primary-light);
  background: #f8fafc;
}

.nav-tab-btn.active {
  background: #eff6ff;
  border-color: #2563eb;
  color: #1e3a8a;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
}

.nav-tab-btn.active .tab-sub {
  color: #2563eb;
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

.card-shell {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.card-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.card-title-row h2 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-subtitle {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.sub-input-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
}

.sub-tab-btn {
  background: transparent;
  border: none;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
    .preset-selector {
  background: #f1f5f9;
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 16px;
}

.preset-selector label {
  display: block;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  color: #475569;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.preset-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip-btn {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 600;
  color: #1e293b;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 5px;
}

.chip-btn:hover {
  border-color: #3b82f6;
  background: #eff6ff;
  color: #1d4ed8;
}

.chip-btn.active {
  background: #2563eb;
  color: #ffffff;
  border-color: #2563eb;
}

.input-group {
  margin-bottom: 16px;
}

.custom-textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-family: inherit;
  color: #0f172a;
  outline: none;
  resize: vertical;
  transition: border-color 0.2s;
}

.custom-textarea:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.voice-input-box {
  background: #f8fafc;
  border: 2px dashed #94a3b8;
  border-radius: var(--radius-md);
  padding: 24px;
  text-align: center;
  margin-bottom: 16px;
}

.record-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #dc2626;
  border: none;
  color: #ffffff;
  font-size: 1.6rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
  transition: all 0.2s;
}

.sub-tab-btn.active {
  background: #e2e8f0;
  color: #0f172a;
}
.record-btn.recording {
  animation: pulse-red 1.2s infinite;
  background: #b91c1c;
}

@keyframes pulse-red {
  0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6); }
  70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(220, 38, 38, 0); }
  100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
}

.cta-btn-primary {
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: #ffffff;
  border: none;
  padding: 14px 28px;
  border-radius: var(--radius-md);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  width: 100%;
}

.cta-btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
}

.cta-btn-primary:active {
  transform: translateY(1px);
}

.analysis-loader {
  display: none;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 30px 20px;
  text-align: center;
  margin-bottom: 24px;
}

.analysis-loader.active {
  display: block;
}

.spinner-circle {
  width: 48px;
  height: 48px;
  border: 4px solid #e2e8f0;
  border-top: 4px solid #2563eb;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px auto;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}

.verdict-card {
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-md);
  transition: all 0.3s ease;
  border: 2px solid;
}

.verdict-card.verdict-scam {
  background: var(--scam-bg);
  border-color: var(--scam-border);
}

.verdict-card.verdict-risky {
  background: var(--risky-bg);
  border-color: var(--risky-border);
}

.verdict-card.verdict-verify {
  background: var(--verify-bg);
  border-color: var(--verify-border);
}

.verdict-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}
    
.verdict-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  border-radius: 999px;
  font-weight: 800;
  font-size: 1.15rem;
  letter-spacing: 0.3px;
}

.verdict-scam .verdict-badge {
  background: #dc2626;
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3);
}

.verdict-risky .verdict-badge {
  background: #d97706;
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(217, 119, 6, 0.3);
}

.verdict-verify .verdict-badge {
  background: #059669;
  color: #ffffff;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
}

.verdict-confidence {
  font-size: 0.85rem;
  font-weight: 700;
  color: #475569;
}

.voice-explanation-player {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 16px 20px;
  margin-bottom: 20px;
  border: 1px solid rgba(0, 0, 0, 0.06);
  box-shadow: var(--shadow-sm);
}

.voice-controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 10px;
}

.play-voice-btn {
  background: #1e3a8a;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 999px;
  font-size: 0.92rem;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.play-voice-btn:hover {
  background: #2563eb;
  transform: scale(1.02);
}

.voice-speed-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #f1f5f9;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
}

.voice-waveform-canvas {
  width: 100%;
  height: 40px;
  background: #f8fafc;
  border-radius: 6px;
  display: block;
  margin-bottom: 10px;
}

.spoken-transcript {
  font-size: 0.95rem;
  color: #1e293b;
  line-height: 1.6;
  font-weight: 500;
  background: #f8fafc;
  padding: 12px 14px;
  border-left: 4px solid #2563eb;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}

.clear-action-block {
  background: #ffffff;
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin-bottom: 20px;
  border: 2px solid;
}

.verdict-scam .clear-action-block {
  border-color: #ef4444;
  background: #fff5f5;
}

.verdict-risky .clear-action-block {
  border-color: #f59e0b;
  background: #fffdf5;
}

.verdict-verify .clear-action-block {
  border-color: #10b981;
  background: #f7fee7;
}

.action-label {
  font-size: 0.8rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.verdict-scam .action-label { color: #b91c1c; }
.verdict-risky .action-label { color: #b45309; }
.verdict-verify .action-label { color: #047857; }

.action-text {
  font-size: 1.15rem;
  font-weight: 800;
  line-height: 1.4;
  color: #0f172a;
}

.flagged-points {
  margin-bottom: 20px;
}

.flagged-points h4 {
  font-size: 0.95rem;
  font-weight: 800;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #1e293b;
}

.flagged-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.flag-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #ffffff;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  border: 1px solid rgba(0, 0, 0, 0.05);
}
    .flag-icon {
  font-size: 1.1rem;
  flex-shrink: 0;
  margin-top: 2px;
}

.verdict-actions-footer {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 600px) {
  .verdict-actions-footer {
    grid-template-columns: 1fr;
  }
}

.trusted-person-btn {
  background: #059669;
  color: #ffffff;
  border: none;
  padding: 12px 18px;
  border-radius: var(--radius-md);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 10px rgba(5, 150, 105, 0.25);
}

.trusted-person-btn:hover {
  background: #047857;
}

.report-portal-btn {
  background: #dc2626;
  color: #ffffff;
  border: none;
  padding: 12px 18px;
  border-radius: var(--radius-md);
  font-size: 0.92rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
  box-shadow: 0 4px 10px rgba(220, 38, 38, 0.25);
}

.report-portal-btn:hover {
  background: #b91c1c;
}

.paper-disclaimer-banner {
  background: #fff7ed;
  border-left: 5px solid #ea580c;
  padding: 12px 16px;
  border-radius: var(--radius-sm);
  margin-bottom: 20px;
  font-size: 0.9rem;
  color: #9a3412;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 10px;
}

.paper-viewer-grid {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 20px;
}

@media (max-width: 860px) {
  .paper-viewer-grid {
    grid-template-columns: 1fr;
  }
}

.paper-preview-card {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  position: relative;
}

.stamp-paper-mock {
  background: #fffdf5;
  border: 1px solid #dcd3b2;
  padding: 20px;
  min-height: 380px;
  font-family: 'Courier New', Courier, monospace;
  font-size: 0.82rem;
  line-height: 1.6;
  color: #292524;
  position: relative;
  overflow: hidden;
  box-shadow: inset 0 0 15px rgba(0,0,0,0.03);
}

.stamp-header {
  border-bottom: 2px double #b45309;
  text-align: center;
  padding-bottom: 8px;
  margin-bottom: 12px;
  font-weight: 700;
  color: #b45309;
  text-transform: uppercase;
}

.trap-highlight {
  background: #fee2e2;
  border-bottom: 2px dashed #dc2626;
  font-weight: 700;
  color: #991b1b;
  padding: 0 4px;
  display: inline;
}

.stamp-watermark {
  position: absolute;
  top: 40%;
  left: 10%;
  right: 10%;
  transform: rotate(-25deg);
  font-size: 2rem;
  font-weight: 900;
  color: rgba(220, 38, 38, 0.12);
  text-align: center;
  pointer-events: none;
  border: 4px dashed rgba(220, 38, 38, 0.2);
  padding: 10px;
}

.questions-card {
  background: #f0fdf4;
  border: 2px solid #86efac;
  border-radius: var(--radius-md);
  padding: 18px 20px;
  margin-bottom: 20px;
}

.questions-header {
  color: #166534;
  font-size: 1.05rem;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.questions-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.question-box {
  background: #ffffff;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  border-left: 4px solid #16a34a;
  box-shadow: var(--shadow-sm);
}

.question-target {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  color: #dc2626;
  margin-bottom: 2px;
}

.question-phrase {
  font-size: 0.92rem;
  font-weight: 700;
  color: #14532d;
}

.question-subtext {
  font-size: 0.8rem;
  color: #475569;
  margin-top: 4px;
}
.trusted-contacts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}

.contact-card {
  background: #ffffff;
  border: 1.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: all 0.2s;
  cursor: pointer;
}

.contact-card:hover {
  border-color: #2563eb;
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.contact-card.selected {
  border-color: #2563eb;
  background: #eff6ff;
}

.contact-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #e2e8f0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  flex-shrink: 0;
}

.contact-info h4 {
  font-size: 0.98rem;
  font-weight: 700;
  color: #0f172a;
}

.contact-info .contact-role {
  font-size: 0.8rem;
  color: #64748b;
  font-weight: 500;
}

.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(15, 23, 42, 0.7);
  z-index: 1000;
  backdrop-filter: blur(4px);
  padding: 16px;
  overflow-y: auto;
  align-items: center;
  justify-content: center;
}

.modal-overlay.active {
  display: flex;
}

.modal-card {
  background: #ffffff;
  max-width: 650px;
  width: 100%;
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25);
  position: relative;
  animation: slide-up 0.25s ease-out;
}

@keyframes slide-up {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-close-btn {
  position: absolute;
  top: 18px;
  right: 18px;
  background: #f1f5f9;
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #475569;
}

.whatsapp-simulation-screen {
  background: #efeae2;
  border-radius: var(--radius-md);
  padding: 18px;
  border: 1px solid #d1d7db;
  margin-top: 16px;
  margin-bottom: 20px;
}

.wa-chat-bubble {
  background: #ffffff;
  border-radius: 10px;
  padding: 12px 14px;
  max-width: 90%;
  margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.15);
  position: relative;
}

.wa-chat-bubble.sender-me {
  background: #d9fdd3;
  margin-left: auto;
}

.wa-chat-bubble.sender-other {
  background: #ffffff;
  margin-right: auto;
}

.wa-sender-name {
  font-size: 0.75rem;
  font-weight: 700;
  color: #128c7e;
  margin-bottom: 4px;
}

.wa-alert-header {
  font-size: 0.95rem;
  font-weight: 800;
  color: #dc2626;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.wa-timestamp {
  font-size: 0.7rem;
  color: #667781;
  text-align: right;
  margin-top: 4px;
}

.shg-response-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}

.shg-reply-btn {
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.15s;
}

.shg-reply-btn.danger {
  background: #dc2626;
  color: #ffffff;
}

.shg-reply-btn.warning {
  background: #d97706;
  color: #ffffff;
}

.shg-reply-btn.call {
  background: #2563eb;
  color: #ffffff;
}

.guide-step {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
}

.step-number {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #1e3a8a;
  color: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  flex-shrink: 0;
  font-size: 1rem;
}

.step-body h4 {
  font-size: 1rem;
  font-weight: 700;
  color: #0f172a;
  margin-bottom: 4px;
}

.step-body p {
  font-size: 0.88rem;
  color: #475569;
}

.copy-snippet-box {
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-top: 10px;
  font-family: monospace;
  font-size: 0.82rem;
  white-space: pre-wrap;
  color: #0f172a;
  position: relative;
}

.copy-btn-floating {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #1e3a8a;
  color: white;
  border: none;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
}

@media (max-width: 640px) {
  .app-header {
    padding: 16px;
  }
  .card-shell {
    padding: 16px;
  }
  .verdict-header {
    flex-direction: column;
    align-items: flex-start;
  }
}

.utility-actions-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}

.demo-story-pill {
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  color: #ffffff;
  border: none;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 2px 8px rgba(124, 58, 237, 0.3);
  transition: all 0.2s;
}

.demo-story-pill:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
}

.offline-toggle-container {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #f8fafc;
  padding: 5px 12px;
  border-radius: 999px;
  border: 1.5px solid #cbd5e1;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
}

.offline-toggle-container.active-offline {
  background: #fef2f2;
  border-color: #f87171;
  color: #991b1b;
}

.privacy-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  color: #166534;
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  font-weight: 700;
}

.offline-mode-indicator-box {
  background: #fffbeb;
  border: 1.5px solid #f59e0b;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 0.88rem;
  color: #92400e;
}

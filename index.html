<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e3a8a">
  <title>Bharosa Shield (भरोसा शील्ड) — Instant Fraud & Document Verification</title>
  <link rel="manifest" href="manifest.json">
  <style>
:root {
  --primary: #1e3a8a; 
  --primary-light: #3b82f6;
  --primary-dark: #0f172a;
  --accent-saffron: #f97316;
  --accent-emerald: #10b981;
  --bg-slate: #f8fafc;
  --card-bg: #ffffff;
  --text-main: #0f172a;
  --text-muted: #475569;
  --border: #e2e8f0;
  --scam-red: #dc2626;
  --scam-bg: #fef2f2;
  --scam-border: #f87171;
  
  --risky-amber: #d97706;
  --risky-bg: #fffbeb;
  --risky-border: #fcd34d;
  
  --verify-green: #059669;
  --verify-bg: #ecfdf5;
  --verify-border: #6ee7b7;

  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
}
    * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Devanagari', 'Noto Sans Tamil', 'Noto Sans Telugu', sans-serif;
  background-color: var(--bg-slate);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
}
.app-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 16px 80px 16px;
}

.emergency-strip {
  background: linear-gradient(90deg, #991b1b, #dc2626);
  color: #ffffff;
  padding: 8px 16px;
  font-size: 0.85rem;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  margin-bottom: 16px;
}

.emergency-strip a {
  color: #fef08a;
  text-decoration: underline;
  margin-left: 6px;
}

.emergency-strip .call-badge {
  background: #ffffff;
  color: #dc2626;
  padding: 3px 10px;
  border-radius: 9999px;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.emergency-subtext {
  font-size: 0.8rem;
  display: none;
}

@media (min-width: 600px) {
  .emergency-subtext {
    display: block;
  }
}

.app-header {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 14px;
}

.brand-logo {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, #1e3a8a, #0284c7);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 26px;
  box-shadow: 0 4px 10px rgba(30, 58, 138, 0.25);
}

.brand-titles h1 {
  font-size: 1.45rem;
  font-weight: 800;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-titles .tagline {
  font-size: 0.88rem;
  color: var(--text-muted);
}

.core-question-pill {
  background: #eff6ff;
  border: 1.5px solid #bfdbfe;
  color: #1e40af;
  padding: 8px 14px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.lang-select-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #f1f5f9;
  padding: 6px 12px;
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  font-weight: 600;
  color: #334155;
  border: 1px solid #cbd5e1;
}

.lang-select-box select {
  background: transparent;
  border: none;
  font-weight: 700;
  color: #0f172a;
  outline: none;
  cursor: pointer;
  font-size: 0.88rem;
}

.main-nav {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

@media (max-width: 768px) {
  .main-nav {
    grid-template-columns: repeat(2, 1fr);
  }
}

.nav-tab-btn {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  padding: 14px 12px;
  border-radius: var(--radius-md);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 6px;
  font-weight: 700;
  font-size: 0.92rem;
  color: var(--text-muted);
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
}

.nav-tab-btn .tab-icon {
  font-size: 1.35rem;
}

.nav-tab-btn .tab-sub {
  font-size: 0.75rem;
  font-weight: 500;
  color: #64748b;
}

.nav-tab-btn:hover {
  border-color: var(--primary-light);
  background: #f8fafc;
}

.nav-tab-btn.active {
  background: #eff6ff;
  border-color: #2563eb;
  color: #1e3a8a;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
}

.nav-tab-btn.active .tab-sub {
  color: #2563eb;
}

.tab-panel {
  display: none;
}

.tab-panel.active {
  display: block;
}

.card-shell {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.card-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.card-title-row h2 {
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-subtitle {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin-bottom: 20px;
}

.sub-input-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 8px;
}

.sub-tab-btn {
  background: transparent;
  border: none;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.85rem;
  font-weight: 600;
  color: #64748b;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
    .preset-selector {
  background: #f1f5f9;
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 16px;
}

.preset-selector label {
  display: block;
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  color: #475569;
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.preset-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip-btn {
  background: #ffffff;
  border: 1px solid #cbd5e1;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.82rem;
  font-weight: 600;
  color: #1e293b;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 5px;
}

.chip-btn:hover {
  border-color: #3b82f6;
  background: #eff6ff;
  color: #1d4ed8;
}

.chip-btn.active {
  background: #2563eb;
  color: #ffffff;
  border-color: #2563eb;
}

.input-group {
  margin-bottom: 16px;
}

.custom-textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-family: inherit;
  color: #0f172a;
  outline: none;
  resize: vertical;
  transition: border-color 0.2s;
}

.custom-textarea:focus {
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.voice-input-box {
  background: #f8fafc;
  border: 2px dashed #94a3b8;
  border-radius: var(--radius-md);
  padding: 24px;
  text-align: center;
  margin-bottom: 16px;
}

.record-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #dc2626;
  border: none;
  color: #ffffff;
  font-size: 1.6rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
  transition: all 0.2s;
}

.sub-tab-btn.active {
  background: #e2e8f0;
  color: #0f172a;
}
